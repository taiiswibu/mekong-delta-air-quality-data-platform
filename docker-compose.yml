name: vietnam-air-quality-platform

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Airflow 3 Execution API JWT
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/project/src:/opt/project
    SNOWFLAKE_PRIVATE_KEY_PATH: /opt/project/.secrets/rsa_key.p8
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
      {"conn_type":"snowflake","login":"${SNOWFLAKE_USER}","password":"${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}","schema":"CONTROL","extra":{"account":"${SNOWFLAKE_ACCOUNT}","database":"${SNOWFLAKE_DATABASE:-AQ_WAREHOUSE}","warehouse":"${SNOWFLAKE_WAREHOUSE:-AQ_WH}","role":"${SNOWFLAKE_ROLE:-SYSADMIN}","private_key_file":"/opt/project/.secrets/rsa_key.p8"}}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./:/opt/project
  depends_on:
    postgres:
      condition: service_healthy
  networks: [aqnet]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    networks: [aqnet]

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [aqnet]

  kafka-init:
    image: apache/kafka:4.3.1
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC_AIR_QUALITY:-air_quality.raw}
      --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [aqnet]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [aqnet]

  airflow-init:
    <<: *airflow-common
    command: bash -lc "airflow db migrate"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/project/.secrets/rsa_key.p8
    command: python -m kafka.producer.waqi_producer
    volumes:
      - ./:/opt/project
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aqnet]

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/project/.secrets/rsa_key.p8
    command: python -m kafka.consumer.snowflake_consumer
    volumes:
      - ./:/opt/project
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aqnet]

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file: .env
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/project/.secrets/rsa_key.p8
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./:/opt/project
    restart: unless-stopped
    networks: [aqnet]

volumes:
  airflow-postgres:
  kafka-data:

networks:
  aqnet:
    driver: bridge
